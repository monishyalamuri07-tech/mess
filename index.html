<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Mess Pass</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#262626">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mess Pass">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #000;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale
    }

    body {
      min-height: 100dvh
    }

    button,
    input {
      font: inherit
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      background: #fff;
      position: relative
    }

    .screen,
    .pass {
      width: 100%;
      min-height: 100dvh;
      background: #fff
    }

    .hidden {
      display: none !important
    }

    .header {
      height: 52px;
      min-height: 52px;
      background: #242424;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.2px;
      z-index: 10
    }

    .header-grabber {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 4px;
      border-radius: 4px;
      background: #777
    }

    .header .x {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      padding: 8px 12px;
      -webkit-tap-highlight-color: transparent
    }

    .header .back {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 24px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      padding: 8px 12px;
      -webkit-tap-highlight-color: transparent
    }

    .header .history {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      padding: 8px 6px;
      -webkit-tap-highlight-color: transparent
    }


    /* Profile setup */
    .form-wrap {
      height: calc(100dvh - 52px);
      overflow: auto;
      padding: 16px;
      background: #fff;
      -webkit-overflow-scrolling: touch
    }

    .notice {
      background: #eaf8ef;
      border: 1px solid #a9dfbd;
      color: #126b3b;
      border-radius: 9px;
      padding: 11px 13px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.35
    }

    .photo-preview {
      width: 170px;
      height: 170px;
      margin: 0 auto 16px;
      border-radius: 14px;
      overflow: hidden;
      background: #eee;
      border: 1px solid #bbb
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .field {
      margin: 0 0 15px
    }

    .field label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px
    }

    .field input,
    .field select {
      width: 100%;
      height: 50px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: #fff;
      color: #000 !important;
      font-size: 16px;
      padding: 0 13px;
      outline: none
    }

    .accent-controls {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .accent-controls input[type="color"] {
      width: 58px;
      height: 50px;
      padding: 4px;
      border: 1px solid #aaa;
      border-radius: 7px;
      background: #fff;
      cursor: pointer
    }

    .accent-controls #accentHex {
      flex: 1;
      box-sizing: border-box;
      font-family: monospace;
      font-weight: 600;
      text-transform: uppercase
    }

    .field input::file-selector-button {
      background: #666;
      color: #fff;
      border: 0;
      padding: 9px 11px;
      margin-right: 9px;
      border-radius: 4px
    }

    .save {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 7px;
      background: #198f5b;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      margin-top: 4px;
      cursor: pointer
    }

    .small {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
      line-height: 1.4
    }

    /* Coupon screen: matches reference device layout & fonts perfectly */
    .coupon {
      background: #e8e8e8;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
      padding-bottom: 24px;
    }

    .coupon-shell {
      background: #fff;
      margin: 0 14px;
      border: 1px solid #d5d5d5;
      border-top: none;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .15);
      padding: 8px 10px 22px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .coupon-card {
      margin: 0;
      background: linear-gradient(135deg, #ff7b6b 0%, #ffc468 100%);
      border-radius: 12px;
      padding: 12px 14px 16px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .12);
      box-sizing: border-box;
    }

    .coupon-photo {
      width: 94px;
      height: 94px;
      border-radius: 12px;
      overflow: hidden;
      margin: 0 auto 8px;
      background: #e0e0e0;
    }

    .coupon-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nameid {
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.25;
      margin-bottom: 12px;
      color: #1f1f1f;
      letter-spacing: 0.1px;
    }

    .detail {
      font-size: 12.5px;
      line-height: 1.28;
      margin: 0 0 7px;
      color: #2c2c2c;
      text-align: left;
    }

    .detail strong {
      display: block;
      margin-bottom: 1px;
      font-size: 12.5px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .detail:last-child {
      margin-bottom: 0
    }

    .instruction {
      text-align: center;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.32;
      padding: 16px 10px 10px;
      color: #1a1a1a;
    }

    .rate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      margin: 0 auto 16px;
      border: 1.5px solid #6c1a26;
      color: #2c1216;
      background: #fff;
      border-radius: 6px;
      padding: 3.5px 14px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      width: max-content;
      cursor: pointer;
    }

    .rate-star {
      color: #d9a726;
      font-size: 13px;
      line-height: 1;
    }

    .meal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 14px;
      padding: 0 6px;
      margin: 0 auto;
      width: 100%;
      max-width: 340px;
      box-sizing: border-box;
    }

    .meal {
      height: 46px;
      border: none;
      border-radius: 7px;
      background: linear-gradient(105deg, #ff8272 0%, #ffcf71 100%);
      box-shadow: 0 3px 6px rgba(0, 0, 0, .18);
      font-size: 15px;
      color: #3d1519;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .08s ease, filter .08s ease;
    }

    .meal:active {
      transform: scale(0.98);
      filter: brightness(0.96);
    }

    .meal span {
      margin-left: 6px;
      font-size: 15px;
      font-weight: 400;
    }

    .meal:nth-child(3) {
      grid-column: 1 / 2;
    }

    /* Mess pass: intentionally scrollable, matching the larger original pass layout */
    .pass {
      background: #e7e7e7;
      min-height: 100dvh;
      height: 100dvh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 18px
    }

    .pass-card {
      background: #fff;
      margin: 0 15px;
      border-radius: 0 0 15px 15px;
      overflow: hidden;
      min-height: 0;
      height: auto
    }

    .pass-top {
      padding: 68px 15px 18px;
      position: relative
    }

    .badge {
      position: absolute;
      right: 12px;
      top: 10px;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #b3b3b3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800
    }

    .pass-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      text-align: center
    }

    .frame {
      border: 1px solid #000;
      padding: 12px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .5)
    }

    .frame img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block
    }

    .pass-text {
      font-weight: 800;
      font-size: 15px;
      margin-top: 8px;
      line-height: 1.4;
      text-shadow: 1px 2px 4px rgba(0, 0, 0, .35)
    }

    .pass-sub {
      font-weight: 700;
      font-size: 14px;
      margin-top: 2px;
      line-height: 1.4
    }

    .qr-frame {
      padding: 10px
    }

    .qr-frame img {
      background: #fff
    }

    .info {
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      padding: 22px 15px 8px
    }

    .date-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 35px;
      font-size: 18px;
      font-weight: 800;
      margin: 15px 0 18px
    }

    .approved {
      font-family: inherit;
      text-align: center;
      color: #62c354;
      font-size: 28px;
      font-weight: 800;
      margin: 18px 0 14px;
      text-shadow: 0 0 10px rgba(98, 195, 84, .4)
    }

    .rate-pass {
      text-align: center
    }

    .rate-pass .rate {
      margin-bottom: 25px
    }

    .video-strip {
      background: var(--accent, #062506);
      padding: 25px
    }

    .video-box {
      background: #fff;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff
    }

    .footer {
      padding: 25px;
      background: #fff
    }

    .gray {
      color: #9a9a9a;
      font-size: 14px;
      font-weight: 600;
      margin-top: 22px
    }

    .value {
      color: #000;
      font-size: 15px;
      font-weight: 600;
      margin-top: 6px;
      line-height: 1.4
    }

    .verification-code {
      margin: 30px 0 4px;
      border: 2px solid #222;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      background: #fff;
      box-sizing: border-box;
    }

    .verification-code .label {
      font-weight: 700;
    }

    .verification-code .number {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* Camera scanner */
    .scanner {
      width: 100%;
      height: 100dvh;
      background: #101010;
      min-height: 100dvh;
      color: #fff;
      position: relative;
      overflow: hidden
    }

    .scanner video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #101010
    }

    .camera-shade {
      position: absolute;
      inset: 0;
      background: rgba(35, 35, 35, .34);
      pointer-events: none
    }

    .scan-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 72vh);
      height: min(72vw, 72vh);
      transform: translate(-50%, -50%);
      aspect-ratio: 1/1;
      border: none;
      border-radius: 0;
      box-shadow: 0 0 0 9999px rgba(85, 85, 85, .42);
      pointer-events: none;
      z-index: 1
    }

    .scan-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 72vh);
      height: 2px;
      transform: translateX(-50%);
      background: #d21f45;
      box-shadow: 0 0 12px #ff3d67;
      animation: lineBlink .72s steps(1, end) infinite;
      pointer-events: none;
      z-index: 2
    }

    .dot {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #ffd21a;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 4px rgba(255, 210, 26, .75);
      z-index: 2
    }

    .scanner-title,
    .scanner-status,
    .camera-denied {
      display: none
    }

    @keyframes lineBlink {

      0%,
      38% {
        opacity: 1
      }

      39%,
      100% {
        opacity: 0
      }
    }

    @media(max-width:360px) {
      .coupon-shell {
        margin-left: 8px;
        margin-right: 8px;
        padding-left: 8px;
        padding-right: 8px
      }

      .coupon-card {
        padding: 10px 12px 14px
      }

      .coupon-photo {
        width: 86px;
        height: 86px
      }

      .nameid {
        font-size: 14px;
        margin-bottom: 10px
      }

      .detail {
        font-size: 11.5px;
        margin-bottom: 6px
      }

      .detail strong {
        font-size: 11.5px
      }

      .meal-grid {
        gap: 10px 10px;
        padding: 0 2px
      }

      .meal {
        height: 44px;
        font-size: 14px
      }

      .instruction {
        font-size: 16px;
        padding: 12px 6px 8px
      }

      .rate {
        font-size: 12px;
        margin-bottom: 12px
      }
    }

    /* Feedback modal */
    .feedback-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .48);
      z-index: 100;
      display: none;
      align-items: flex-end;
    }

    .feedback-backdrop.open {
      display: flex
    }

    .feedback-modal {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .feedback-header {
      height: 124px;
      min-height: 124px;
      background: #303030;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 19px;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
    }

    .feedback-header .feedback-close {
      position: absolute;
      right: 16px;
      top: 7px;
      color: #fff;
      font-size: 34px;
      line-height: 1;
      font-weight: 300;
      cursor: pointer;
    }

    .feedback-grabber {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 5px;
      border-radius: 8px;
      background: #ddd;
    }

    .feedback-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 20px 0 36px;
    }

    .feedback-intro {
      text-align: center;
      padding: 0 20px;
    }

    .feedback-title {
      margin: 0;
      font-size: 25px;
      line-height: 1.15;
      font-weight: 700;
    }

    .feedback-subtitle {
      margin: 20px 0 24px;
      font-size: 20px;
      line-height: 1.2;
    }

    .feedback-stars {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 0 auto 32px;
    }

    .feedback-star {
      border: 0;
      background: transparent;
      padding: 0;
      width: 42px;
      height: 48px;
      font-size: 43px;
      line-height: 1;
      color: #f2b600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .feedback-star:focus {
      outline: none
    }

    .feedback-star.empty {
      color: #f2b600
    }

    .feedback-form {
      display: none;
      padding: 0 20px
    }

    .feedback-form.show {
      display: block
    }

    .feedback-label {
      font-size: 18px;
      margin: 4px 0 20px;
    }

    .feedback-section {
      margin: 0 0 28px;
    }

    .feedback-section-title {
      text-align: center;
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      margin: 0 0 18px;
    }

    .feedback-options {
      background: #fff;
      border: 1px solid #f0f0f0;
    }

    .feedback-option {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid #ddd;
      font-size: 17px;
    }

    .feedback-option:last-child {
      border-bottom: 0
    }

    .feedback-option input {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #888;
      border-radius: 2px;
      background: #fff;
      flex: 0 0 auto;
      position: relative;
    }

    .feedback-option input:checked {
      background: #ff7a22;
      border-color: #ff7a22;
    }

    .feedback-option input:checked::after {
      content: '✓';
      position: absolute;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      left: 2px;
      top: -1px;
    }

    .feedback-meals {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .feedback-meal {
      min-width: 0;
      height: 50px;
      border: 2px solid #999;
      border-radius: 16px;
      background: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .feedback-meal {
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .feedback-meal.selected {
      border-color: #ff7a22;
      transform: scale(1.06);
      box-shadow: 0 0 14px 3px rgba(255, 122, 34, .48);
      background: #fffaf6;
    }

    .feedback-remarks {
      width: 100%;
      min-height: 76px;
      resize: none;
      border: 1px solid #bbb;
      border-radius: 3px;
      padding: 10px;
      font-size: 16px;
      outline: none;
    }

    .feedback-submit {
      display: block;
      width: 285px;
      max-width: 90%;
      height: 58px;
      margin: 24px auto 0;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(105deg, #ff8075, #ffd477);
      box-shadow: 0 5px 8px #888;
      font-size: 21px;
      color: #111;
      cursor: pointer;
    }

    .feedback-message {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .28);
    }

    .feedback-message.show {
      display: flex
    }

    .feedback-message-box {
      width: 300px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .35);
      text-align: center;
    }

    .feedback-message-box h3 {
      margin: 20px 12px 8px;
      font-size: 18px;
    }

    .feedback-message-box p {
      margin: 0 18px 20px;
      font-size: 14px;
      line-height: 1.45;
    }

    .feedback-message-box button {
      width: 100%;
      height: 48px;
      border: 0;
      border-top: 1px solid #ddd;
      background: #fff;
      color: #ff7a22;
      font-size: 18px;
      cursor: pointer;
    }

    @media(max-width:360px) {
      .feedback-stars {
        gap: 10px
      }

      .feedback-star {
        width: 38px;
        font-size: 39px
      }

      .feedback-title {
        font-size: 23px
      }

      .feedback-subtitle {
        font-size: 18px
      }

      .feedback-meals {
        gap: 8px
      }

      .feedback-meal {
        font-size: 14px
      }
    }
  </style>
</head>
